    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- EXIF.js for photo metadata reading -->
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .leaflet-popup-content-wrapper {
            padding: 0;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .leaflet-popup-content {
            margin: 0;
            width: 260px !important;
        }
        .custom-photo-marker {
            transition: transform 0.2s ease-in-out;
        }
        .custom-photo-marker:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }
        .marker-pin {
            width: 44px;
            height: 44px;
            border-radius: 50% 50% 50% 0;
            position: absolute;
            transform: rotate(-45deg);
            left: 50%;
            top: 50%;
            margin: -22px 0 0 -22px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 3px solid #ffffff;
            overflow: hidden;
            background: #0284c7;
        }
        .marker-pin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: rotate(45deg) scale(1.3);
        }
        /* User location pulsing dot style */
        .user-location-marker {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .user-location-dot {
            width: 16px;
            height: 16px;
            background-color: #38bdf8;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            position: relative;
        }
        .user-location-dot::after {
            content: '';
            position: absolute;
            top: -7px;
            left: -7px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: rgba(56, 189, 248, 0.4);
            animation: user-pulse 1.8s infinite ease-out;
        }
        @keyframes user-pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4); /* slate-400 with opacity */
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.7);
        }
        
        /* Specific scrollbar styling for drawers to match the requested look */
        .drawer-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .drawer-scrollbar::-webkit-scrollbar-track {
             background: rgba(15, 23, 42, 0.3); /* dark slate track */
             border-radius: 4px;
        }
        .drawer-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8; /* Solid slate-400 thumb */
            border-radius: 4px;
            border: 2px solid rgba(30, 41, 59, 0.95); /* matching the drawer background */
        }
        .drawer-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1; /* Lighter on hover */
        }

        /* Enhanced smooth scrolling for drawer lists */
        .touch-scroll {
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            touch-action: pan-y; /* 強制行動裝置允許上下滑動 */
        }
    </style>
</head>

        // --- Application State ---
        let spots = [...initialSpots];

        function initMap() {
            map = L.map('map', {
                center: [25.0330, 121.5654], // Default Taipei
                zoom: 10,
                zoomControl: false
            });

            currentActiveLayer.addTo(map);

            markersGroup = L.layerGroup().addTo(map);

            // Click map to view coordinates (純瀏覽座標，不包含打卡)
            map.on('click', (e) => {
                const lat = e.latlng.lat.toFixed(5);
                const lng = e.latlng.lng.toFixed(5);

                const popupContent = `
                    <div class="text-center p-2 min-w-[140px]">
                        <div class="font-bold text-slate-800 mb-1 text-sm flex justify-center items-center gap-1">

                        </div>
                        <div class="text-[11px] text-slate-500 font-mono bg-slate-100 rounded px-1 py-0.5 inline-block">${lat}, ${lng}</div>
                    </div>
                `;

                L.popup({ className: 'custom-popup', closeButton: true })
                    .setLatLng(e.latlng)
                    .setContent(popupContent)
                    .openOn(map);
            });

            renderSpots();
        }

        function renderSpots() {
            markersGroup.clearLayers();
            const listEl = document.getElementById('spotList');
            listEl.innerHTML = '';

            // 判斷當前是否處於「僅顯示收藏」模式，動態切換基底資料
            let baseData = isShowingSaved ? initialSpots.filter(s => savedSpots.includes(s.id)) : initialSpots;

            let filtered = baseData.filter(spot => {
                const matchCat = currentFilter === 'all' || spot.category === currentFilter;
                const matchSearch = spot.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                                    spot.locationName.toLowerCase().includes(currentSearch.toLowerCase()) ||
                                    spot.description.toLowerCase().includes(currentSearch.toLowerCase());
                const matchCountry = currentCountry === 'all' || spot.country === currentCountry;
                
                return matchCat && matchSearch && matchCountry;
            });

            // Default sorting by popularity (likes)
            filtered.sort((a, b) => (b.likes || 0) - (a.likes || 0));

            document.getElementById('spotCount').textContent = filtered.length;

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-camera-slash text-4xl mb-3"></i>
                        <p class="text-sm">沒有找到符合條件的照片地點</p>
                    </div>
                `;
                return;
            }

            const bounds = [];

            filtered.forEach(spot => {
                bounds.push([spot.lat, spot.lng]);

                // Calculate distance if user location is known
                let distText = '';
                if (userLocation) {
                    const km = getDistanceInKm(userLocation.lat, userLocation.lng, spot.lat, spot.lng);
                    distText = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
                }

                // 1. Create Custom Map Marker with Photo Badge
                const customIcon = L.divIcon({
                    className: 'custom-photo-marker',
                    html: `
                        <div class="marker-pin">
                            <img src="${spot.photo}" alt="${spot.title}" onerror="this.src='https://placehold.co/100x100/0284c7/fff?text=Photo'">
                        </div>
                    `,
                    iconSize: [44, 44],
                    iconAnchor: [22, 44],
                    popupAnchor: [0, -40]
                });

                const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });

                // Leaflet Popup HTML
                const popupContent = `
                    <div class="bg-slate-800 text-slate-100 font-sans">
                        <img src="${spot.photo}" class="w-full h-32 object-cover" onerror="this.src='https://placehold.co/300x200/0284c7/fff?text=Photo'">
                        <div class="p-3">
                            <h4 class="font-bold text-sm text-white truncate mb-1">${spot.title}</h4>
                            <p class="text-[11px] text-sky-400 mb-1 truncate"><i class="fa-solid fa-location-dot"></i> ${spot.locationName}</p>
                            ${distText ? `<p class="text-[10px] text-amber-400 font-medium mb-2"><i class="fa-solid fa-route mr-1"></i>距離您約 ${distText}</p>` : ''}
                            <button onclick="openSpotModal('${spot.id}')" class="w-full py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-medium transition">
                                查看取景詳細攻略
                            </button>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupContent);
                markersGroup.addLayer(marker);

                // 2. Render Card to Sidebar with updated horizontal list layout matching IMG_20261005_233318.jpg
                const isSaved = savedSpots.includes(spot.id);
                const card = document.createElement('div');
                card.className = 'bg-[#1e293b] hover:bg-slate-700/80 border border-slate-700/70 hover:border-sky-500/50 rounded-2xl overflow-hidden shadow-sm transition cursor-pointer flex items-center h-[72px] group relative p-1 pr-3';
                
                card.onclick = () => {
                    map.flyTo([spot.lat, spot.lng], 15, { duration: 1.2 });
                    marker.openPopup();
                };

                card.innerHTML = `
                    <div class="w-[120px] h-full rounded-xl overflow-hidden shrink-0 relative bg-slate-900 group/img mr-3 ml-0.5" onclick="event.stopPropagation(); openSpotModal('${spot.id}')" title="點擊查看相片大圖與拍攝指南">
                        <img src="${spot.photo}" alt="${spot.title}" class="w-full h-full object-cover group-hover/img:scale-110 transition duration-300" onerror="this.src='https://placehold.co/200x200/0284c7/fff?text=Photo'">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover/img:opacity-100 transition flex items-center justify-center text-white text-xs font-medium">
                            <i class="fa-solid fa-eye"></i>
                        </div>
                        <span class="absolute top-1.5 left-1.5 bg-sky-600 text-white text-[10px] px-1.5 py-0.5 rounded-sm shadow-md font-medium tracking-wide">
                            ${getCategoryLabel(spot.category)}
                        </span>
                    </div>
                    
                    <div class="flex-1 flex items-center justify-between min-w-0 pr-1">
                        <h3 class="font-bold text-[13px] text-slate-100 group-hover:text-sky-400 transition truncate leading-tight">${spot.title}</h3>
                        
                        <div class="flex items-center gap-3 shrink-0 ml-2">
                             ${distText ? `<span class="text-amber-400 font-medium text-[10px] hidden sm:block whitespace-nowrap"><i class="fa-solid fa-location-arrow mr-0.5"></i>${distText}</span>` : ''}
                            <button onclick="event.stopPropagation(); toggleSaveSpot('${spot.id}')" class="text-slate-400 hover:text-sky-400 p-1 transition" title="收藏景點">
                                <i class="${isSaved ? 'fa-solid text-sky-400' : 'fa-regular'} fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });

            // Adjust view to fit markers if initial load
            if (bounds.length > 0 && currentSearch === '' && currentFilter === 'all' && !userLocation) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
            }
        }

        function getDistanceInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function getCategoryLabel(cat) {
            const catMap = {
                'asia-pacific': '亞洲&其他',
                'oceania': '大洋洲',
                'europe': '歐洲'
            };
            return catMap[cat] || '營區';
        }

        // --- Layout Toggles ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            closeDetailPanel(); // 開啟列表時自動關閉詳細攻略
            sidebar.classList.toggle('-translate-x-full');
        }

        function closeDetailPanel() {
            const detailSidebar = document.getElementById('detailSidebar');
            // 套用隱藏動畫：手機版往下隱藏，電腦版往左隱藏
            detailSidebar.classList.remove('translate-y-0', 'sm:translate-x-0');
            detailSidebar.classList.add('translate-y-full', 'sm:-translate-x-full');
        }

        function trackUserLocation(flyToUser = false) {
            if (!navigator.geolocation) {
                showToast('您的瀏覽器不支援地理定位功能');
                return;
            }

            const myLocBtn = document.getElementById('myLocationBtn');
            if (myLocBtn && flyToUser) {
                // 點擊按鈕時顯示旋轉動畫
                myLocBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-base"></i>';
            }

            if (flyToUser) {
                showToast('正在精準定位並追蹤您的地理位置...');
            }

            // 清除之前的追蹤
            if (watchPositionId) {
                navigator.geolocation.clearWatch(watchPositionId);
            }

            // 改用 watchPosition 進行持續追蹤
            watchPositionId = navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude, longitude, accuracy } = pos.coords;
                    userLocation = { lat: latitude, lng: longitude };

                    if (userMarker) map.removeLayer(userMarker);
                    if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);

                    userAccuracyCircle = L.circle([latitude, longitude], {
                        radius: accuracy || 100,
                        color: '#0284c7',
                        fillColor: '#38bdf8',
                        fillOpacity: 0.15,
                        weight: 1
                    }).addTo(map);

                    const userIcon = L.divIcon({
                        className: 'user-location-marker',
                        html: `<div class="user-location-dot"></div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });

                    userMarker = L.marker([latitude, longitude], { icon: userIcon, zIndexOffset: 2000 })
                        .bindPopup('<div class="p-2 text-xs font-semibold text-slate-800"><i class="fa-solid fa-street-view text-sky-600 mr-1"></i>您目前的所在位置</div>')
                        .addTo(map);

                    if (flyToUser) {
                        map.flyTo([latitude, longitude], 15, { duration: 1.5 });
                        // 飛行動畫結束後開啟彈窗
                        setTimeout(() => { if (userMarker) userMarker.openPopup(); }, 1500);
                        flyToUser = false; // 只在首次點擊時飛去該地點，後續在背景默默更新座標
                        showToast('已成功鎖定您的目前位置！');
                    }

                    if (myLocBtn) {
                        // 恢復準星圖示並亮起藍色表示正在追蹤中
                        myLocBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
                        myLocBtn.classList.add('text-sky-400', 'bg-slate-700');
                    }

                    renderSpots();
                },
                (err) => {
                    console.warn('Location access denied or unavailable:', err);
                    if (flyToUser) {
                        let errorMsg = '無法取得您的位置';
                        if (err.code === 1) errorMsg = '定位失敗：您已拒絕瀏覽器存取位置權限。';
                        if (err.code === 2) errorMsg = '定位失敗：無法獲取目前的訊號位置。';
                        if (err.code === 3) errorMsg = '定位失敗：取得位置資訊超時，請重試。';
                        showToast(errorMsg);
                    }
                    if (myLocBtn) myLocBtn.innerHTML = '<i class="fa-solid fa-location-crosshairs text-base"></i>';
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
            );
        }

        function openSpotModal(spotId) {
            const spot = spots.find(s => s.id === spotId);
            if (!spot) return;

            document.getElementById('modalPhoto').src = spot.photo;
            document.getElementById('modalTitle').textContent = spot.title;
            
            let locationText = `<i class="fa-solid fa-location-dot"></i> ${spot.locationName}`;
            if (userLocation) {
                const km = getDistanceInKm(userLocation.lat, userLocation.lng, spot.lat, spot.lng);
                const distStr = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(1)} km`;
                locationText += ` <span class="ml-2 text-amber-400 font-normal">(距您 ${distStr})</span>`;
            }
            document.getElementById('modalLocation').innerHTML = locationText;
            document.getElementById('modalDescription').textContent = spot.description;
            document.getElementById('modalCategoryBadge').textContent = getCategoryLabel(spot.category);
            
            // 設定外部連結網址（Facebook 專屬連結與該篇攻略手冊的自訂下載網址）
            document.getElementById('modalFacebookLink').href = spot.fbLink || 'https://www.facebook.com/profile.php?id=61593630944835';
            document.getElementById('modalGuideLink').href = spot.guideLink || '#';

            // Save state button
            const isSaved = savedSpots.includes(spot.id);
            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.innerHTML = `<i class="${isSaved ? 'fa-solid text-sky-400' : 'fa-regular'} fa-bookmark"></i>`;
            saveBtn.onclick = () => {
                toggleSaveSpot(spot.id);
                openSpotModal(spot.id);
            };

            // Google Maps Navigation button
            document.getElementById('modalNavigateBtn').onclick = () => {
                window.open(`https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`, '_blank');
            };

            // Google Maps Street View button
            document.getElementById('modalStreetViewBtn').onclick = () => {
                window.open(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${spot.lat},${spot.lng}`, '_blank');
            };

            // Copy Coordinates button
            document.getElementById('modalCopyCoordBtn').onclick = () => {
                const text = `${spot.lat}, ${spot.lng}`;
                navigator.clipboard ? navigator.clipboard.writeText(text) : document.execCommand('copy');
                showToast('已複製經緯度至剪貼簿！');
            };

            // --- Enable Responsive Drawer Layout ---
            const detailSidebar = document.getElementById('detailSidebar');
            const sidebar = document.getElementById('sidebar');

            // 關閉列表面板
            sidebar.classList.add('-translate-x-full');

            // 滑出詳細攻略面板 (響應式自動判斷底部滑出或左側滑出)
            detailSidebar.classList.remove('translate-y-full', 'sm:-translate-x-full');
            detailSidebar.classList.add('translate-y-0', 'sm:translate-x-0');

            // Fly map to selected coordinates
            map.flyTo([spot.lat, spot.lng], 15, { duration: 1.2 });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            if (!toast || !toastMsg) return;
            toastMsg.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function toggleSaveSpot(id) {
            const idx = savedSpots.indexOf(id);
            if (idx > -1) {
                savedSpots.splice(idx, 1);
                showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'Removed from saved' : '已從口袋名單移除');
                
                // 如果在「收藏模式」下取消收藏，且名單清空了，則自動返回「最初始的全集列表」
                if (isShowingSaved && savedSpots.length === 0) {
                    isShowingSaved = false;
                    
                    // 重置條件：回到全部地區與全部國家
                    currentFilter = 'all';
                    currentCountry = 'all';
                    
                    // 同步更新介面顯示
                    document.getElementById('countrySelect').value = 'all';
                    document.querySelectorAll('#categoryFilter button').forEach(b => {
                        b.className = b.dataset.cat === 'all' 
                            ? 'px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-medium shrink-0 transition flex flex-col items-center justify-center gap-0.5'
                            : 'px-3 py-1.5 rounded-lg bg-transparent text-slate-300 hover:bg-slate-700 text-xs shrink-0 transition flex flex-col items-center justify-center gap-0.5';
                    });

                    const btn = document.getElementById('savedSpotsBtn');
                    if (btn) {
                        btn.classList.remove('bg-sky-600', 'text-white');
                        btn.classList.add('bg-slate-700/60', 'text-slate-200');
                    }
                    showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'No saved spots left, resetting to all spots' : '口袋名單已空，自動返回初始全集列表');
                }
            } else {
                savedSpots.push(id);
                showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'Saved to pocket list!' : '已儲存至口袋名單！');
            }
            localStorage.setItem('saved_photo_spots', JSON.stringify(savedSpots));
            updateSavedBadge();
            renderSpots();
        }

        function updateSavedBadge() {
            const badge = document.getElementById('savedBadge');
            if (!badge) return;
            if (savedSpots.length > 0) {
                badge.textContent = savedSpots.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initMap();
            updateSavedBadge();

            // Search Input Event
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchGlobalBtn');
            
            if (searchInput) {
                // 即時過濾列表
                searchInput.addEventListener('input', (e) => {
                    currentSearch = e.target.value;
                    renderSpots();
                });
                // 按下 Enter 搜尋全球地點
                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter' && searchInput.value.trim() !== '') {
                        searchGlobalLocation(searchInput.value);
                    }
                });
            }
            
            if (searchBtn && searchInput) {
                // 點擊按鈕搜尋全球地點
                searchBtn.addEventListener('click', () => {
                    if (searchInput.value.trim() !== '') {
                        searchGlobalLocation(searchInput.value);
                    }
                });
            }

            // Close Detail Panel Button
            const closeBtn = document.getElementById('closeDetailBtn');
            if (closeBtn) {
                closeBtn.onclick = () => {
                    closeDetailPanel();
                };
            }

            // Google Maps Style Selector Menu
            const styleBtn = document.getElementById('mapStyleBtn');
            const styleMenu = document.getElementById('mapStyleMenu');

            styleBtn.onclick = (e) => {
                e.stopPropagation();
                styleMenu.classList.toggle('hidden');
            };

            document.addEventListener('click', () => {
                styleMenu.classList.add('hidden');
            });

            styleMenu.querySelectorAll('button').forEach(btn => {
                btn.onclick = () => {
                    const layerKey = btn.dataset.layer;
                    if (googleTileLayers[layerKey]) {
                        map.removeLayer(currentActiveLayer);
                        currentActiveLayer = googleTileLayers[layerKey];
                        currentActiveLayer.addTo(map);
                        document.getElementById('mapStyleLabel').textContent = btn.textContent.trim();
                        showToast(`已切換為 ${btn.textContent.trim()}`);
                    }
                };
            });

            // Category Filter Buttons
            document.getElementById('categoryFilter').addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;

                document.querySelectorAll('#categoryFilter button').forEach(b => {
                    b.className = 'px-3 py-1.5 rounded-lg bg-transparent text-slate-300 hover:bg-slate-700 text-xs shrink-0 transition';
                });
                btn.className = 'px-3 py-1.5 rounded-lg bg-sky-600 text-white text-xs font-medium shrink-0 transition';

                currentFilter = btn.dataset.cat;
                renderSpots();
            });

            // Country Select Event Listener
            document.getElementById('countrySelect').addEventListener('change', (e) => {
                currentCountry = e.target.value;
                renderSpots();
            });

            // User My Location Button Click
            document.getElementById('myLocationBtn').onclick = () => {
                trackUserLocation(true);
            };

            // Automatically attempt user location on app launch
            trackUserLocation(false);

            // Saved Spots Drawer / Filter
            const savedBtn = document.getElementById('savedSpotsBtn');
            if (savedBtn) {
                savedBtn.onclick = () => {
                    if (isShowingSaved) {
                        // 狀態：關閉收藏模式，返回全部列表
                        isShowingSaved = false;
                        savedBtn.classList.remove('bg-sky-600', 'text-white');
                        savedBtn.classList.add('bg-slate-700/60', 'text-slate-200');
                        renderSpots();
                        showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'Showing all spots' : '已返回顯示全集列表');
                    } else {
                        // 狀態：開啟收藏模式
                        if (savedSpots.length === 0) {
                            showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'You haven\'t saved any spots yet!' : '您尚未收藏任何口袋地點喔！');
                            return;
                        }
                        isShowingSaved = true;
                        savedBtn.classList.add('bg-sky-600', 'text-white');
                        savedBtn.classList.remove('bg-slate-700/60', 'text-slate-200');
                        renderSpots();
                        showToast((typeof isEnglish !== 'undefined' && isEnglish) ? 'Showing saved spots' : '已為您顯示已收藏口袋名單');
                    }
                };
            }

            // Map Zoom & Fullscreen Controls
            document.getElementById('zoomInBtn').onclick = (e) => {
                e.stopPropagation();
                map.zoomIn();
            };

            document.getElementById('zoomOutBtn').onclick = (e) => {
                e.stopPropagation();
                map.zoomOut();
            };

            const fullscreenBtn = document.getElementById('fullscreenBtn');
            let isCssFullscreen = false; // 新增 CSS 全螢幕狀態標記

            fullscreenBtn.onclick = async (e) => {
                e.stopPropagation();
                const elem = document.documentElement;
                const mapContainer = document.getElementById('mapContainer');

                if (!document.fullscreenElement && !isCssFullscreen) {
                    try {
                        // 嘗試使用原生全螢幕 API
                        if (elem.requestFullscreen) {
                            await elem.requestFullscreen();
                        } else if (elem.webkitRequestFullscreen) { /* Safari */
                            await elem.webkitRequestFullscreen();
                        } else if (elem.msRequestFullscreen) { /* IE11 */
                            await elem.msRequestFullscreen();
                        }
                    } catch (err) {
                        // 如果因為 iFrame 或權限政策被阻擋，改用 CSS 網頁內全螢幕備用方案
                        console.warn("原生全螢幕被阻擋，啟用網頁內全螢幕備用方案", err);
                        isCssFullscreen = true;
                        mapContainer.classList.add('fixed', 'inset-0', 'z-[9999]');
                        fullscreenBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                        fullscreenBtn.title = "退出全螢幕";
                        showToast('已啟用網頁內全螢幕模式');
                        setTimeout(() => map.invalidateSize(), 300);
                    }
                } else {
                    if (document.fullscreenElement) {
                        // 退出原生全螢幕
                        if (document.exitFullscreen) {
                            await document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) { /* Safari */
                            await document.webkitExitFullscreen();
                        } else if (document.msExitFullscreen) { /* IE11 */
                            await document.msExitFullscreen();
                        }
                    } else if (isCssFullscreen) {
                        // 退出 CSS 網頁內全螢幕
                        isCssFullscreen = false;
                        mapContainer.classList.remove('fixed', 'inset-0', 'z-[9999]');
                        fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                        fullscreenBtn.title = "切換全螢幕";
                        setTimeout(() => map.invalidateSize(), 300);
                    }
                }
            };

            // 監聽全螢幕狀態改變（例如使用者按 ESC 退出原生全螢幕時，需更新按鈕圖示）
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement && !isCssFullscreen) {
                    fullscreenBtn.innerHTML = '<i class="fa-solid fa-expand"></i>';
                    fullscreenBtn.title = "切換全螢幕";
                } else if (document.fullscreenElement) {
                    fullscreenBtn.innerHTML = '<i class="fa-solid fa-compress"></i>';
                    fullscreenBtn.title = "退出全螢幕";
                }
                setTimeout(() => map.invalidateSize(), 300);
            });
        });
    </script>
</body>
</html>
